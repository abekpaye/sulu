<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5" style="max-width:520px;">

  <a href="/login" class="btn btn-outline-secondary mb-4">← Back to Login</a>

  <h1 class="mb-3">Create account | sūlu</h1>

  <div id="msg" class="mb-3"></div>

  <form id="registerForm" class="card p-3">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" required />
    </div>

    <button class="btn btn-dark w-100" type="submit">Register</button>

    <div class="text-center mt-3">
      <span class="text-muted">Already have an account?</span>
      <a href="/login" class="ms-1">Login</a>
    </div>
  </form>

  <script src="/js/register.js"></script>
</body>
</html>
