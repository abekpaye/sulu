<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/category_style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.png">

  <title>sūlu</title>
</head>

<body>

<header>
  <div class="header-container">
    <div class="logo"><a href="/">sūlu</a></div>
    <nav class="topnavbar">
      <ul>
        <li><a href="/login">Sign in</a></li>
        <li><a href="/cart">Cart <span id="cart-count">0</span></a></li>
      </ul>
    </nav>
  </div>

  <nav class="navbar">
    <ul>
      <li><a href="/best-sellers">Best sellers</a></li>
      <li><a href="/tops">Tops</a></li>
      <li><a href="/bottoms">Bottoms</a></li>
      <li><a href="/pyjamas">Pyjamas</a></li>
    </ul>
  </nav>
</header>

<main>
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/images/carousel/carousel-1.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="/images/carousel/carousel-2.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="/images/carousel/carousel-3.jpg" class="d-block w-100">
      </div>
    </div>
  </div>

  <section class="container my-5">
    <h3 class="mb-4">Filter products</h3>

    <form id="filter-form" class="row g-3">

      
      <div class="col-md-3">
        <input
          type="text"
          class="form-control"
          name="name"
          placeholder="Product name"
          autocomplete="off">
      </div>

      <div class="col-md-3">
        <select class="form-select" name="category">
          <option value="">All categories</option>
          <option value="tops">Tops</option>
          <option value="bottoms">Bottoms</option>
          <option value="pyjamas">Pyjamas</option>
        </select>
      </div>

      <div class="col-md-2">
        <input type="number" class="form-control" name="minPrice" placeholder="Min price">
      </div>

      <div class="col-md-2">
        <input type="number" class="form-control" name="maxPrice" placeholder="Max price">
      </div>

      <div class="col-md-2">
        <select class="form-select" name="sortBy">
          <option value="">Sort by</option>
          <option value="price">Price</option>
          <option value="title">Title</option>
        </select>
      </div>

      <div class="col-md-2">
        <select class="form-select" name="order">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </div>

      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          name="fields"
          placeholder="title,category,price,image"
          value="title,category,price,image">
        <small class="text-muted">Projection (fields)</small>
      </div>

      <div class="col-md-12">
        <button type="submit" class="btn btn-dark">Apply filters</button>
        <button type="reset" class="btn btn-outline-secondary ms-2">Clear</button>
      </div>

    </form>
  </section>

  <div class="product-grid container my-5">
    <div id="products-row" class="row g-4"></div>
  </div>

</main>

  <footer>
    <div class="footer-container">
      <div class="footer-left">
        <p>© 2025 sūlu. All rights reserved.</p>
        <div class="links">
          <a class="about" href="/about">About Us</a>
          <a class="chart" href="/chart">Size chart</a>
          <a href="/admin">Admin panel</a>
        </div>
      </div>

      <div class="footer-center">
        <p>&#128222 +7 707 123 45 67</p>
        <p>&#128232 sulu.store@gmail.com</p>
      </div>

      <div class="footer-right">
        <p>Follow us:</p>
        <div class="social-links">
          <a href="https://www.instagram.com/skims/">Instagram</a>
          <a href="https://www.tiktok.com/@skims">TikTok</a>
          <a href="https://www.youtube.com/c/skims">YouTube</a>
        </div>
      </div>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/cart_add.js"></script>
<script src="/js/products.js"></script>

</body>
</html>
