<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/about_style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.png">

  <title>Admin | sūlu</title>
</head>

<body>
  <header>
      <div class="header-container">
          <div class="logo"><a href="/">sūlu</a></div>
          <nav class="topnavbar">
              <ul>
                  <a href="/login" id="auth-link">Sign in</a>
                  <li><a href="/cart">Cart<span id="cart-count">0</span></a></li>
              </ul>
          </nav>
      </div>
  </header>

  <main class="container my-5">

    <h1 class="mb-4">Admin Panel</h1>

    <div id="adminOnly">
      <form id="product-form">

        <input type="hidden" id="editingId">

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Price</label>
          <input type="number" class="form-control" id="price" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-control" id="category">
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="pyjamas">Pyjamas</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Sizes</label>
          <input type="text" class="form-control" id="sizes" placeholder="S,M,L,XL">
        </div>

        <div class="mb-3">
          <label class="form-label">Image</label>
          <input type="text" class="form-control" id="image">
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="inStock" checked>
          <label class="form-check-label">In stock</label>
        </div>

        <button type="submit" class="btn btn-dark" id="submit-btn">
          Add product
        </button>

      </form>
    </div>

    <div id="message" class="mt-3"></div>

    <hr class="my-5">

    <h3>Products</h3>
    <div id="products-list" class="row g-3"></div>

  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-left">
        <p>© 2025 sūlu. All rights reserved.</p>
        <div class="links">
          <a class="about" href="/about">About Us</a>
          <a class="chart" href="/chart">Size chart</a>
        </div>
      </div>

      <div class="footer-center">
        <p>&#128222 +7 707 123 45 67</p>
        <p>&#128232 sulu.store@gmail.com</p>
      </div>

      <div class="footer-right">
        <p>Follow us:</p>
        <div class="social-links">
          <a href="https://www.instagram.com/skims/">Instagram</a>
          <a href="https://www.tiktok.com/@skims">TikTok</a>
          <a href="https://www.youtube.com/c/skims">YouTube</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/js/cart_add.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
