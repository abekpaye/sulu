<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – Add Product</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-5">

  <h1 class="mb-4">Admin Panel</h1>

  <form id="product-form">

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" id="title" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="number" class="form-control" id="price" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <select class="form-control" id="category">
        <option value="tops">Tops</option>
        <option value="bottoms">Bottoms</option>
        <option value="pyjamas">Pyjamas</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Sizes (comma separated)</label>
      <input type="text" class="form-control" id="sizes" placeholder="S,M,L,XL">
    </div>

    <div class="mb-3">
      <label class="form-label">Image path</label>
      <input type="text" class="form-control" id="image" value="/images/xmas-products/1.png">
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="inStock" checked>
      <label class="form-check-label">In stock</label>
    </div>

    <button type="submit" class="btn btn-dark">Add product</button>
  </form>

  <div id="message" class="mt-4"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
